site_name: KX Packet Inspector Documentation
site_description: "Reverse engineering documentation for the Guild Wars 2 network protocol."
repo_url: https://github.com/Krixx1337/kx-packet-inspector
edit_uri: edit/main/docs/

theme:
  name: material
  logo: # Optional: add a path to a logo file
  features:
    - navigation.instant
    - navigation.sections
    - navigation.top
    - content.code.copy
  palette:
    # Palette toggle for light vs dark mode
    - scheme: slate
      primary: indigo
      accent: blue
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
    - scheme: default
      primary: indigo
      accent: blue
      toggle:
        icon: material/weather-night
        name: Switch to dark mode

plugins:
  - search         # The built-in search engine, enhanced by the Material theme
  - awesome-pages  # Automates the navigation sidebar
  - section-index  # Makes folders with READMEs clickable section indexes